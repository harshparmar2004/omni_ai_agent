name: OmniStudio Watchtower 24/7 Autonomous Cron

on:
  schedule:
    # Triggers every 30 minutes during Indian active hours (03:00 UTC / 08:30 AM IST to 16:00 UTC / 09:30 PM IST)
    # Automatically respected by Watchtower Audience Window Pacing & Night Blackout Engine
    - cron: '*/30 3-15 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub web UI, Vercel cron, or Telegram
    inputs:
      force:
        description: 'Force publish even during off-peak or blackout'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write

concurrency:
  group: watchtower-cron
  cancel-in-progress: true

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📁 Ensure Data Directory
        run: mkdir -p data

      - name: 💾 Restore Database Cache
        uses: actions/cache@v4
        id: db-cache
        with:
          path: data/
          key: omnistudio-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            omnistudio-db-${{ runner.os }}-

      - name: ⚙️ Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 💾 Restore Node Modules Cache
        uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 📦 Install Node Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: ⚡ Ensure Native Cloudflared Executable
        run: |
          if ! command -v cloudflared &> /dev/null; then
            echo "[Watchtower Runner] Installing native Cloudflared binary..."
            sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
            sudo chmod +x /usr/local/bin/cloudflared
          fi
          cloudflared --version

      - name: 🎬 Link & Verify FFmpeg and FFprobe
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            try {
              const ff = require('ffmpeg-static');
              if (ff && fs.existsSync(ff)) {
                execSync('sudo ln -sf ' + ff + ' /usr/local/bin/ffmpeg');
              }
            } catch (e) {}
            try {
              const fp = require('ffprobe-static');
              if (fp && fp.path && fs.existsSync(fp.path)) {
                execSync('sudo ln -sf ' + fp.path + ' /usr/local/bin/ffprobe');
              }
            } catch (e) {}
          "
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: 💾 Cache Pip Packages
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 💾 Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: 🌐 Install Fast Media Stream Downloader
        run: pip install --quiet yt-dlp requests playwright

      - name: 🚀 Run Autonomous Surveillance & Auto-Publish Cycle
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          MOVIE_META_ACCESS_TOKEN: ${{ secrets.MOVIE_META_ACCESS_TOKEN }}
          MOVIE_IG_USER_ID: ${{ secrets.MOVIE_IG_USER_ID }}
          CLUBBING_META_ACCESS_TOKEN: ${{ secrets.CLUBBING_META_ACCESS_TOKEN || secrets.TECH_META_ACCESS_TOKEN }}
          CLUBBING_IG_USER_ID: ${{ secrets.CLUBBING_IG_USER_ID || '29109331262052643' }}
          TECH_META_ACCESS_TOKEN: ${{ secrets.CLUBBING_META_ACCESS_TOKEN || secrets.TECH_META_ACCESS_TOKEN }}
          TECH_IG_USER_ID: ${{ secrets.CLUBBING_IG_USER_ID || secrets.TECH_IG_USER_ID || '29109331262052643' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '5443723531' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COMPETITOR_ACCOUNTS: ${{ secrets.COMPETITOR_ACCOUNTS || vars.COMPETITOR_ACCOUNTS }}
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          FEED_BRANDING_MODE: 'frame'
          FORCE_PUBLISH: ${{ inputs.force || 'false' }}
          NODE_ENV: production
        run: |
          node scripts/cron_runner.js

      - name: 💾 Save Database State
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/
          key: omnistudio-db-${{ runner.os }}-${{ github.run_id }}
