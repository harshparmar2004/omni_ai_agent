name: OmniStudio On-Demand Telegram Reposter

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target Instagram URL to Repost'
        required: true
        type: string
      chat_id:
        description: 'Telegram Chat ID to notify'
        required: false
        default: '5443723531'
        type: string
      page_id:
        description: 'Destination Page ID'
        required: false
        default: '1'
        type: string
      message_id:
        description: 'Telegram Message ID to edit in-place'
        required: false
        default: ''
        type: string
      force:
        description: 'Force re-publish even if already in db'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write


jobs:
  execute-repost:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📁 Ensure Clean Data Directory
        run: |
          mkdir -p data
          rm -f data/.telegram_error_notified

      - name: 💾 Restore Database Cache
        uses: actions/cache@v4
        id: db-cache
        with:
          path: data/
          key: omnistudio-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            omnistudio-db-${{ runner.os }}-

      - name: 🧹 Clear Stale Telegram Error Cache
        run: rm -f data/.telegram_error_notified

      - name: ⚙️ Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📡 Notify Telegram: Cloud Runner Online
        if: github.event.inputs.message_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8887232624:AAGI8q912YhGLF10wfPc1EtOTR1DFzkVEkI' }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id }}
          TELEGRAM_MESSAGE_ID: ${{ github.event.inputs.message_id }}
        run: |
          node -e "
            const axios = require('axios');
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID || '5443723531';
            const msgId = process.env.TELEGRAM_MESSAGE_ID;
            const shortcode = '${{ github.event.inputs.url }}'.match(/(?:p|reel|tv)\/([A-Za-z0-9_-]+)/)?.[1] || 'reel';
            if (!token || !msgId) process.exit(0);
            axios.post('https://api.telegram.org/bot' + token + '/editMessageText', {
              chat_id: chatId,
              message_id: parseInt(msgId, 10),
              text: '⚡ <b>Agent 1 (Reposter Engine) Engaged:</b> <code>#' + shortcode + '</code>\n' +
                    '📱 <b>Destination:</b> Cloud runner connected & active\n\n' +
                    '✅ <b>1. Ingest:</b> Cloud runner spawned & active\n' +
                    '⏳ <b>2. Download:</b> Starting media extraction...\n' +
                    '⚪ <b>3. AI Hook & Copy:</b> Waiting\n' +
                    '⚪ <b>4. Publishing:</b> Waiting (Reel & Story)\n\n' +
                    '<i>Status: Cloud worker online, extracting media...</i>',
              parse_mode: 'HTML'
            }).catch(() => {});
          "

      - name: 💾 Restore Node Modules Cache
        uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 📦 Install Node Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: ⚡ Ensure Native Cloudflared Executable
        continue-on-error: true
        run: |
          if ! command -v cloudflared &> /dev/null; then
            echo "[Cloud Runner] Installing native Cloudflared binary..."
            sudo curl --retry 5 --retry-delay 2 -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared || true
            sudo chmod +x /usr/local/bin/cloudflared || true
          fi
          cloudflared --version || echo "Native cloudflared not present, will use npx fallback"

      - name: 🎬 Link & Verify FFmpeg and FFprobe
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            try {
              const ff = require('ffmpeg-static');
              if (ff && fs.existsSync(ff)) {
                execSync('sudo ln -sf ' + ff + ' /usr/local/bin/ffmpeg');
              }
            } catch (e) {}
            try {
              const fp = require('ffprobe-static');
              if (fp && fp.path && fs.existsSync(fp.path)) {
                execSync('sudo ln -sf ' + fp.path + ' /usr/local/bin/ffprobe');
              }
            } catch (e) {}
          "
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: 💾 Cache Pip Packages
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 💾 Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: 🌐 Install Fast Media Stream Downloader
        run: pip install --quiet yt-dlp requests playwright

      - name: 🚀 Run Autonomous Reposter Engine
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          MOVIE_META_ACCESS_TOKEN: ${{ secrets.MOVIE_META_ACCESS_TOKEN }}
          MOVIE_IG_USER_ID: ${{ secrets.MOVIE_IG_USER_ID }}
          CLUBBING_META_ACCESS_TOKEN: ${{ secrets.CLUBBING_CULT_META_ACCESS_TOKEN || secrets.CLUBBING_META_ACCESS_TOKEN || secrets.TECH_META_ACCESS_TOKEN }}
          CLUBBING_CULT_META_ACCESS_TOKEN: ${{ secrets.CLUBBING_CULT_META_ACCESS_TOKEN || secrets.CLUBBING_META_ACCESS_TOKEN || secrets.TECH_META_ACCESS_TOKEN }}
          CLUBBING_IG_USER_ID: ${{ secrets.CLUBBING_CULT_IG_USER_ID || secrets.CLUBBING_IG_USER_ID || secrets.TECH_IG_USER_ID || '29109331262052643' }}
          CLUBBING_CULT_IG_USER_ID: ${{ secrets.CLUBBING_CULT_IG_USER_ID || secrets.CLUBBING_IG_USER_ID || secrets.TECH_IG_USER_ID || '29109331262052643' }}
          TECH_META_ACCESS_TOKEN: ${{ secrets.CLUBBING_CULT_META_ACCESS_TOKEN || secrets.CLUBBING_META_ACCESS_TOKEN || secrets.TECH_META_ACCESS_TOKEN }}
          TECH_IG_USER_ID: ${{ secrets.CLUBBING_CULT_IG_USER_ID || secrets.CLUBBING_IG_USER_ID || secrets.TECH_IG_USER_ID || '29109331262052643' }}
          CULT_INFO_META_ACCESS_TOKEN: ${{ secrets.CULT_INFO_META_ACCESS_TOKEN || secrets.CULT_INFORMATION_META_ACCESS_TOKEN }}
          CULT_INFORMATION_META_ACCESS_TOKEN: ${{ secrets.CULT_INFO_META_ACCESS_TOKEN || secrets.CULT_INFORMATION_META_ACCESS_TOKEN }}
          CULT_INFO_IG_USER_ID: ${{ secrets.CULT_INFO_IG_USER_ID || secrets.CULT_INFORMATION_IG_USER_ID || '17841462998491309' }}
          CULT_INFORMATION_IG_USER_ID: ${{ secrets.CULT_INFO_IG_USER_ID || secrets.CULT_INFORMATION_IG_USER_ID || '17841462998491309' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8887232624:AAGI8q912YhGLF10wfPc1EtOTR1DFzkVEkI' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TARGET_URL: ${{ github.event.inputs.url }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id }}
          TARGET_PAGE_ID: ${{ github.event.inputs.page_id }}
          TELEGRAM_MESSAGE_ID: ${{ github.event.inputs.message_id }}
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          FEED_BRANDING_MODE: 'frame'
          NODE_ENV: production
        run: |
          FORCE_FLAG="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          node scripts/repost_single.js --url="${{ github.event.inputs.url }}" --chat-id="${{ github.event.inputs.chat_id }}" --page-id="${{ github.event.inputs.page_id }}" --message-id="${{ github.event.inputs.message_id }}" $FORCE_FLAG

      - name: 📢 Notify Telegram on Failure or Cancellation
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8887232624:AAGI8q912YhGLF10wfPc1EtOTR1DFzkVEkI' }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id }}
          TELEGRAM_MESSAGE_ID: ${{ github.event.inputs.message_id }}
        run: |
          node -e "
            const axios = require('axios');
            const fs = require('fs');
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID || '5443723531';
            const msgId = process.env.TELEGRAM_MESSAGE_ID;
            if (!token) process.exit(0);

            let specificError = '';
            if (fs.existsSync('data/.telegram_error_notified')) {
              try { specificError = fs.readFileSync('data/.telegram_error_notified', 'utf8').trim(); } catch (_) {}
            }

            const text = '⚠️ <b>Cloud Runner Alert:</b>\n\n' +
              (specificError ? '<b>Details:</b> <code>' + specificError.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>\n\n' : '') +
              'The runner could not complete this repost job. This typically happens if the reel is age-restricted (18+), from a private account, or blocked by Instagram.\n\n' +
              '💡 <i>Please try sharing a public unrestricted reel!</i>';
            if (msgId) {
              axios.post('https://api.telegram.org/bot' + token + '/editMessageText', {
                chat_id: chatId,
                message_id: parseInt(msgId, 10),
                text: text,
                parse_mode: 'HTML'
              }).catch(() => {
                axios.post('https://api.telegram.org/bot' + token + '/sendMessage', {
                  chat_id: chatId,
                  text: text,
                  parse_mode: 'HTML'
                }).catch(() => {});
              });
            } else {
              axios.post('https://api.telegram.org/bot' + token + '/sendMessage', {
                chat_id: chatId,
                text: text,
                parse_mode: 'HTML'
              }).catch(() => {});
            }
          "

      - name: 💾 Save Database State
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/
          key: omnistudio-db-${{ runner.os }}-${{ github.run_id }}
