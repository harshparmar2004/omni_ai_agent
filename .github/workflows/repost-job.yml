name: OmniStudio On-Demand Telegram Reposter

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target Instagram URL to Repost'
        required: true
        type: string
      chat_id:
        description: 'Telegram Chat ID to notify'
        required: false
        default: '5443723531'
        type: string
      page_id:
        description: 'Destination Page ID'
        required: false
        default: '1'
        type: string
      message_id:
        description: 'Telegram Message ID to edit in-place'
        required: false
        default: ''
        type: string
      force:
        description: 'Force re-publish even if already in db'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write

concurrency:
  group: repost-job
  cancel-in-progress: false

jobs:
  execute-repost:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📁 Ensure Data Directory
        run: mkdir -p data

      - name: 💾 Restore Database Cache
        uses: actions/cache@v4
        id: db-cache
        with:
          path: data/
          key: omnistudio-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            omnistudio-db-${{ runner.os }}-

      - name: ⚙️ Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Node Dependencies
        run: npm install --prefer-offline

      - name: 🎬 Link & Verify FFmpeg and FFprobe
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            try {
              const ff = require('ffmpeg-static');
              if (ff && fs.existsSync(ff)) {
                execSync('sudo ln -sf ' + ff + ' /usr/local/bin/ffmpeg');
              }
            } catch (e) {}
            try {
              const fp = require('ffprobe-static');
              if (fp && fp.path && fs.existsSync(fp.path)) {
                execSync('sudo ln -sf ' + fp.path + ' /usr/local/bin/ffprobe');
              }
            } catch (e) {}
          "
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: 🌐 Install Playwright Chromium
        run: |
          pip install --no-cache-dir playwright
          playwright install chromium

      - name: 🚀 Run Autonomous Reposter Engine
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TARGET_URL: ${{ inputs.url }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
          TARGET_PAGE_ID: ${{ inputs.page_id }}
          TELEGRAM_MESSAGE_ID: ${{ inputs.message_id }}
          FEED_BRANDING_MODE: 'frame'
          NODE_ENV: production
        run: |
          FORCE_FLAG="${{ inputs.force == 'true' && '--force' || '' }}"
          node scripts/repost_single.js --url="${{ inputs.url }}" --chat-id="${{ inputs.chat_id }}" --page-id="${{ inputs.page_id }}" --message-id="${{ inputs.message_id }}" $FORCE_FLAG

      - name: 📢 Notify Telegram on Failure or Cancellation
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
          TELEGRAM_MESSAGE_ID: ${{ inputs.message_id }}
        run: |
          node -e "
            const axios = require('axios');
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID || '5443723531';
            const msgId = process.env.TELEGRAM_MESSAGE_ID;
            if (!token) process.exit(0);
            const text = '⚠️ <b>Cloud Runner Alert:</b>\n\nThe GitHub runner encountered an issue or timed out before publishing.\n\n🔄 <i>Please try re-sharing the link again!</i>';
            if (msgId) {
              axios.post('https://api.telegram.org/bot' + token + '/editMessageText', {
                chat_id: chatId,
                message_id: parseInt(msgId, 10),
                text: text,
                parse_mode: 'HTML'
              }).catch(() => {
                axios.post('https://api.telegram.org/bot' + token + '/sendMessage', {
                  chat_id: chatId,
                  text: text,
                  parse_mode: 'HTML'
                }).catch(() => {});
              });
            } else {
              axios.post('https://api.telegram.org/bot' + token + '/sendMessage', {
                chat_id: chatId,
                text: text,
                parse_mode: 'HTML'
              }).catch(() => {});
            }
          "

      - name: 💾 Save Database State
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/
          key: omnistudio-db-${{ runner.os }}-${{ github.run_id }}
